<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
     <style>
     body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .modal {
            background: white;
            border-radius: 8px;
            text-align: center;
        }

        .top-text {
                        color: #3D3D3D;
            font-family: "Cera Pro";
            font-size: 20px;
            font-style: normal;
            font-weight: 500;
            line-height: 16px; /* 80% */
        }

        .top-text span {
                        color: #46A358;
            font-family: "Cera Pro";
            font-size: 20px;
            font-style: normal;
            font-weight: 500;
            line-height: 16px; /* 80% */
        }

        p {
                    color: #3D3D3D;
        font-family: "Cera Pro";
        font-size: 13px;
        font-style: normal;
        font-weight: 400;
        line-height: 16px; /* 123.077% */
        text-align: left;
        }

        form {
            margin-top: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .register-btn {
                        border-radius: 5px;
            background: #46A358;
            
        }

        .p-regist {
                        color: #3D3D3D;
            font-family: "Cera Pro";
            font-size: 13px;
            font-style: normal;
            font-weight: 400;
            line-height: 16px; /* 123.077% */
            text-align: center;
        }

        .social-btn {
            background: white;
            border: 1px solid #ddd;
            margin-top: 10px;
        } 
     </style>  
</head>
<body>
   <div class="modal">
    <div class="top-text">
        Login | <span>Register</span>
    </div>
    <p>Enter your email and password to register.</p>
   <form action="">
        <input type="text" id="username" placeholder="Username" required>
        <input type="text" id="email" placeholder="Enter your email address" required>
        <input type="password" id="password" placeholder="Password" required>
        <input type="password" id="confirm-password" placeholder="Confirm Password" required>
        <button class="register-btn" type="submit">Register</button>
   </form>
   <p class="p-regist">Or register with</p>
   <button class="social-btn"> <img src="./images/google 1.svg" alt="">Continue with Google</button>
   <button class="social-btn"> <img src="./images/facebook 1.png" alt="">Continue with Facebook</button>
   </div>
</body>
</html>
